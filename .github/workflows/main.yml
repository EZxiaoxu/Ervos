name: Build Geode Mod

on:
  push:
    branches:
    # Double check if your branch is 'main' or 'master'
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Mod
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v3.0.0-beta.1
          combine: true
          # This tells GitHub to walk into your folders first
          path: Ervos/src/geode
